# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
  
  # Environment variables for cloud deployment
  env:
    # Firebase Configuration
    NEXT_PUBLIC_FIREBASE_API_KEY: ${secret:NEXT_PUBLIC_FIREBASE_API_KEY}
    NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${secret:NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
    NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${secret:NEXT_PUBLIC_FIREBASE_PROJECT_ID}
    NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${secret:NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
    NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${secret:NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
    NEXT_PUBLIC_FIREBASE_APP_ID: ${secret:NEXT_PUBLIC_FIREBASE_APP_ID}
    GOOGLE_APPLICATION_CREDENTIALS: ${secret:GOOGLE_APPLICATION_CREDENTIALS}
    GOOGLE_CLOUD_PROJECT: ${secret:GOOGLE_CLOUD_PROJECT}
    
    # API Keys
    GEMINI_API_KEY: ${secret:GEMINI_API_KEY}
    SHOTSTACK_API_KEY: ${secret:SHOTSTACK_API_KEY}
    FREE_CONVERT_API_KEY: ${secret:FREE_CONVERT_API_KEY}
    CLOUDE_API_KEY: ${secret:CLOUDE_API_KEY}
    
    # Discord Configuration
    DISCORD_CLIENT_ID: ${secret:DISCORD_CLIENT_ID}
    DISCORD_CLIENT_SECRET: ${secret:DISCORD_CLIENT_SECRET}
    DISCORD_APP_ID: ${secret:DISCORD_APP_ID}
    DISCORD_BOT_TOKEN: ${secret:DISCORD_BOT_TOKEN}
    DISCORD_PUBLIC_KEY: ${secret:DISCORD_PUBLIC_KEY}
    DISCORD_ID: ${secret:DISCORD_ID}
    DISCORD_WEBHOOK_URL: ${secret:DISCORD_WEBHOOK_URL}
    
    # Twitch Configuration
    TWITCH_CLIENT_ID: ${secret:TWITCH_CLIENT_ID}
    TWITCH_CLIENT_SECRET: ${secret:TWITCH_CLIENT_SECRET}
    TWITCH_ID: ${secret:TWITCH_ID}
    TWITCH_BROADCASTER_ID: ${secret:TWITCH_BROADCASTER_ID}
    TWITCH_BOT_USERNAME: ${secret:TWITCH_BOT_USERNAME}
    TWITCH_BOT_USER_ID: ${secret:TWITCH_BOT_USER_ID}
    TWITCH_BOT_OAUTH_TOKEN: ${secret:TWITCH_BOT_OAUTH_TOKEN}
    TWITCH_USER_OAUTH_TOKEN: ${secret:TWITCH_USER_OAUTH_TOKEN}
    TWITCH_BROADCASTER_USERNAME: ${secret:TWITCH_BROADCASTER_USERNAME}
    TWITCH_EVENTSUB_SECRET: ${secret:TWITCH_EVENTSUB_SECRET}
    TWITCH_BOT_CHAT_OAUTH_TOKEN: ${secret:TWITCH_BOT_CHAT_OAUTH_TOKEN}
    TWITCH_BROADCASTER_OAUTH_TOKEN: ${secret:TWITCH_BROADCASTER_OAUTH_TOKEN}
    
    # Server Configuration
    GUILD_ID: ${secret:GUILD_ID}
    BOT_SECRET_KEY: ${secret:BOT_SECRET_KEY}
    HARDCODED_GUILD_ID: ${secret:HARDCODED_GUILD_ID}
    HARDCODED_ADMIN_TWITCH_ID: ${secret:HARDCODED_ADMIN_TWITCH_ID}
    HARDCODED_ADMIN_DISCORD_ID: ${secret:HARDCODED_ADMIN_DISCORD_ID}
    
    # Channel Configuration
    DISCORD_SHOUTOUT_CHANNEL_ID: ${secret:DISCORD_SHOUTOUT_CHANNEL_ID}
    DISCORD_RAID_TRAIN_CHANNEL_ID: ${secret:DISCORD_RAID_TRAIN_CHANNEL_ID}
    DISCORD_CALENDAR_CHANNEL_ID: ${secret:DISCORD_CALENDAR_CHANNEL_ID}
    DISCORD_LEADERBOARD_CHANNEL_ID: ${secret:DISCORD_LEADERBOARD_CHANNEL_ID}
    DISCORD_RAID_PILE_CHANNEL_ID: ${secret:DISCORD_RAID_PILE_CHANNEL_ID}
    DISCORD_VIP_CHANNEL_ID: ${secret:DISCORD_VIP_CHANNEL_ID}
    
    # Points Configuration
    POINTS_TWITCH_FOLLOW: "25"
    POINTS_TWITCH_SUB: "100"
    POINTS_TWITCH_BITS: "1"
    POINTS_TWITCH_RAID: "50"
    POINTS_TWITCH_HOST: "30"
    POINTS_DISCORD_MESSAGE: "1"
    POINTS_DISCORD_REACTION: "2"
    POINTS_DISCORD_VOICE_MINUTE: "5"
    POINTS_DISCORD_HELP_REACTION: "10"
    POINTS_COMMUNITY_HELP: "50"
    POINTS_STREAM_ATTENDANCE: "10"
    POINTS_DAILY_BONUS: "20"
    
    # Raid Configuration
    RAID_PILE_MAX_SIZE: "40"
    RAID_PILE_MIN_SIZE: "10"
    RAID_PILE_POINTS_REWARD: "25"
    EMERGENCY_SLOTS_LOOKAHEAD_HOURS: "12"
    RAID_TRAIN_SLOT_COST: "100"
    EMERGENCY_SLOT_COST: "50"
    
    # Other
    VIP_ENABLE_TEST_LIVE: ${secret:VIP_ENABLE_TEST_LIVE}
